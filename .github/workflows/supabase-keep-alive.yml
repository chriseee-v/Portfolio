name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 08:00 UTC — well within the 7-day pause window
    - cron: "0 8 */3 * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/blog_subscriptions?select=email&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}")

          echo "Supabase ping status: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Supabase is alive and responding."
          else
            echo "❌ Unexpected status $STATUS — check Supabase project."
            exit 1
          fi
